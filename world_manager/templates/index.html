<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Manager - DBMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>ВЕК ИСТОКА</h2>
                <p>Менеджер Мира</p>
            </div>
            <div id="file-tree" class="file-tree"></div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Поиск по истории...">
                </div>
                <div id="tag-cloud" class="tag-cloud"></div>
                <div class="actions">
                    <button id="new-file-btn" class="btn primary">Новый объект</button>
                </div>
            </header>

            <section id="editor-section" class="editor-section hidden">
                <div class="editor-header">
                    <input type="text" id="file-path-display" readonly>
                    <button id="save-btn" class="btn success">Сохранить</button>
                </div>
                <div class="editor-body">
                    <div class="metadata-form">
                        <h3>Метаданные (YAML)</h3>
                        <div id="metadata-fields"></div>
                        <button id="add-tag-btn" class="btn small">Добавить тег</button>
                    </div>
                    <div class="content-editor">
                        <h3>Описание (Markdown)</h3>
                        <textarea id="markdown-body"></textarea>
                    </div>
                </div>
                <div class="image-upload-zone">
                    <input type="file" id="image-input" accept="image/*" style="display:none">
                    <button id="upload-btn" class="btn secondary">Загрузить фото</button>
                    <div id="upload-status"></div>
                </div>
            </section>

            <section id="list-section" class="list-section">
                <div id="file-list" class="file-list"></div>
            </section>
        </main>
    </div>

    <!-- Modal for new object -->
    <div id="new-object-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Создать новый объект</h3>
            <label>Папка:</label>
            <select id="folder-select"></select>
            <label>Имя файла:</label>
            <input type="text" id="new-filename" placeholder="Name.md">
            <label>Шаблон:</label>
            <select id="template-select">
                <option value="">Без шаблона</option>
            </select>
            <div class="modal-actions">
                <button id="create-cancel" class="btn">Отмена</button>
                <button id="create-confirm" class="btn primary">Создать</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
